
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zhoumetry - Level Mode</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 20px;
    height: 100vh;
    overflow: hidden;
}

#left-panel, #right-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 200px;
    flex-shrink: 0;
}

#board {
    position: relative;
    display: grid;
    gap: 2px;
    background: #000;
    border: 3px solid #333;
    border-radius: 8px;
    padding: 8px;
    box-sizing: border-box;
    overflow: hidden;
}

.cell {
    width: 100%;
    height: 100%;
    background: #222;
    border-radius: 2px;
    min-width: 0;
    min-height: 0;
}

.ghost {
    position: absolute;
    box-sizing: border-box;
    background: none;
    border-radius: 2px;
    pointer-events: none;
    border: 2px dashed #fff;
}



.panel-section {
    background: #222;
    padding: 10px;
    border-radius: 5px;
    min-width: 0;
}

.panel-section h3 {
    margin: 0 0 6px 0;
    font-size: 12px;
    color: #aaa;
}

.hold, .next {
    min-height: 50px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.mini-board {
    position: relative;
    width: 50px;
    height: 50px;
    background: transparent;
    margin: 0 auto;
}

.stats div {
    margin: 3px 0;
    font-size: 11px;
}

.control-setting {
    margin: 10px 0;
}

.control-setting label {
    display: block;
    margin: 5px 0;
    font-size: 12px;
}

.control-setting input[type="range"] {
    width: 100%;
}

button {
    background: #4a4;
    color: white;
    border: none;
    padding: 8px;
    cursor: pointer;
    border-radius: 3px;
    font-size: 12px;
    width: 100%;
    margin: 3px 0;
}

button:hover {
    background: #5b5;
}

button:disabled {
    background: #555;
    cursor: not-allowed;
}

#level-info {
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    color: #4a4;
}

#target-status {
    font-size: 14px;
    color: #f88;
    text-align: center;
    margin: 10px 0;
}

.combo-display {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    font-weight: bold;
    color: #ff0;
    text-shadow: 2px 2px 4px #000;
    pointer-events: none;
    z-index: 1000;
    animation: comboFade 1s ease-out;
}

@keyframes comboFade {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
}

.all-clear-effect {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 64px;
    font-weight: bold;
    color: #0ff;
    text-shadow: 3px 3px 6px #000;
    pointer-events: none;
    z-index: 1000;
    animation: allClearFade 2s ease-out;
}

@keyframes allClearFade {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
}

.level-complete-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.level-complete-box {
    background: #222;
    padding: 40px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
}

.level-complete-box h2 {
    color: #0ff;
    font-size: 36px;
    margin: 0 0 20px 0;
}

.level-complete-box button {
    margin: 10px;
    padding: 15px 30px;
    font-size: 16px;
}

.level-select-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    padding: 20px;
    box-sizing: border-box;
}

.level-select-box {
    background: #222;
    padding: 20px;
    border-radius: 10px;
    width: 90vw;
    max-width: 900px;
    max-height: 85vh;
    overflow: hidden;
}

.level-select-box h2 {
    color: #4a4;
    margin: 0 0 15px 0;
    text-align: center;
}

.level-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 15px;
    width: 100%;
}

.level-button {
    padding: 6px 4px;
    background: #333;
    border: 2px solid #555;
    color: #eee;
    cursor: pointer;
    border-radius: 5px;
    font-size: 10px;
    min-height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.1;
}

.level-button:hover {
    background: #444;
    border-color: #4a4;
}

.level-button.current {
    border-color: #4a4;
    background: #2a4;
}

.level-button.locked {
    opacity: 0.5;
    cursor: not-allowed;
}
</style>
</head>
<body>

<!-- 背景音乐 -->
<audio id="bgm" loop autoplay>
  <source src="lib/bgm/ancients lagacy.mp3" type="audio/mpeg">
</audio>

<!-- Left Panel: Level Info, Hold, Next -->
<div id="left-panel">
  <div class="panel-section">
    <h3>Level <span id="level-number">1</span></h3>
    <div id="level-info">welcome to tetr</div>
    <div id="target-status">Targets: 0/0</div>
  </div>
  
  <div class="panel-section">
    <h3>Hold</h3>
    <div id="hold" class="hold"></div>
  </div>
  
  <div class="panel-section">
    <h3>Next</h3>
    <div id="next" class="next"></div>
  </div>
  
  <div class="panel-section stats">
    <h3>Statistics</h3>
    <div>Combo: <span id="comboCount">0</span></div>
    <div>Max Combo: <span id="maxCombo">0</span></div>
    <div>All Clears: <span id="allClearCount">0</span></div>
  </div>
</div>

<!-- Center: Game Board -->
<div id="board"></div>

<!-- Right Panel: Buttons -->
<div id="right-panel">
  <div class="panel-section">
    <button onclick="restartLevel(); this.blur();">Restart Level</button>
    <button onclick="loadLevel(currentLevel - 1); this.blur();" id="prevBtn">Previous Level</button>
    <button onclick="loadLevel(currentLevel + 1); this.blur();" id="nextBtn">Next Level</button>
    <button onclick="showLevelSelect(); this.blur();">Select Level</button>
    <button onclick="loadDailyChallenge(); this.blur();" style="background: #f90; margin-top: 10px;">🌟 Daily Challenge</button>
    <button onclick="showSettings(); this.blur();" style="background: #48a; margin-top: 5px;">⚙️ Settings</button>
    <button onclick="resetProgress(); this.blur();" style="background: #a44; margin-top: 5px;">Reset Progress</button>
  </div>
</div>

<!-- 通关UI -->
<div id="levelCompleteOverlay" class="level-complete-overlay" style="display: none;">
  <div class="level-complete-box">
    <h2>🎉 Level Complete!</h2>
    <p id="completeMessage">All targets covered!</p>
    <button onclick="restartLevel(); hideLevelComplete(); this.blur();">Restart</button>
    <button onclick="nextLevelFromComplete(); this.blur();" id="nextLevelBtn">Next Level</button>
    <button onclick="showLevelSelect(); hideLevelComplete(); this.blur();">Level Select</button>
    <div style="margin-top: 15px;">
      <label style="cursor: pointer; font-size: 14px;">
        <input type="checkbox" id="autoNextLevel" onchange="saveAutoNextSetting()"> 
        Auto proceed to next level
      </label>
    </div>
  </div>
</div>

<!-- 关卡选择UI -->
<div id="levelSelectOverlay" class="level-select-overlay" style="display: none;">
  <div class="level-select-box">
    <h2>Select Level</h2>
    <div class="level-grid" id="levelGrid"></div>
    <button onclick="hideLevelSelect(); this.blur();">Close</button>
  </div>
</div>

<!-- 设置UI -->
<div id="settingsOverlay" class="level-select-overlay" style="display: none;">
  <div class="level-select-box" style="max-width: 700px;">
    <h2>⚙️ Settings</h2>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 20px; text-align: left;">
      <!-- 左列：音频和时间设置 -->
      <div>
        <h3 style="color: #4a4; margin-bottom: 15px;">Audio</h3>
        <div style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 5px;">Music Volume: <span id="volumeValue">30</span>%</label>
          <input type="range" id="volumeSlider" min="0" max="100" value="30" style="width: 100%;" oninput="updateVolumeDisplay()">
        </div>
        
        <div style="margin-bottom: 30px;">
          <label style="display: block; margin-bottom: 5px;">Background Music:</label>
          <select id="bgmSelect" style="width: 100%; padding: 8px; background: #333; color: #eee; border: 1px solid #555; border-radius: 3px;" onchange="changeBGM()">
            <option value="lib/bgm/ancients lagacy.mp3">Ancients Lagacy</option>
            <option value="lib/bgm/strategy meeting.mp3">Strategy Meeting</option>
            <option value="lib/bgm/Zhoumetry.mp3">Zhoumetry</option>
          </select>
        </div>
        
        <h3 style="color: #4a4; margin-bottom: 15px;">Timing</h3>
        <div style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 5px;">DAS (Delayed Auto Shift): <span id="dasValue">100</span>ms</label>
          <input type="range" id="dasSlider" min="0" max="200" value="100" style="width: 100%;" oninput="updateDASDisplay()">
        </div>
        
        <div style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 5px;">Soft Drop Speed: <span id="softDropValue">100</span>ms</label>
          <input type="range" id="softDropSlider" min="0" max="500" value="100" style="width: 100%;" oninput="updateSoftDropDisplay()">
        </div>
      </div>
      
      <!-- 右列：键位绑定 -->
      <div>
        <h3 style="color: #4a4; margin-bottom: 15px;">Key Bindings</h3>
        <div style="display: grid; grid-template-columns: 120px 1fr; gap: 8px; margin-bottom: 20px;">
          <span>Move Left:</span>
          <button id="keyLeft" onclick="rebindKey('left')" style="background: #333; padding: 6px; font-size: 12px;">ArrowLeft</button>
          
          <span>Move Right:</span>
          <button id="keyRight" onclick="rebindKey('right')" style="background: #333; padding: 6px; font-size: 12px;">ArrowRight</button>
          
          <span>Rotate CW:</span>
          <button id="keyRotateCW" onclick="rebindKey('rotateCW')" style="background: #333; padding: 6px; font-size: 12px;">ArrowUp</button>
          
          <span>Rotate CCW:</span>
          <button id="keyRotateCCW" onclick="rebindKey('rotateCCW')" style="background: #333; padding: 6px; font-size: 12px;">Z</button>
          
          <span>Rotate 180°:</span>
          <button id="keyRotate180" onclick="rebindKey('rotate180')" style="background: #333; padding: 6px; font-size: 12px;">A</button>
          
          <span>Soft Drop:</span>
          <button id="keySoftDrop" onclick="rebindKey('softDrop')" style="background: #333; padding: 6px; font-size: 12px;">ArrowDown</button>
          
          <span>Hard Drop:</span>
          <button id="keyHardDrop" onclick="rebindKey('hardDrop')" style="background: #333; padding: 6px; font-size: 12px;">Space</button>
          
          <span>Hold:</span>
          <button id="keyHold" onclick="rebindKey('hold')" style="background: #333; padding: 6px; font-size: 12px;">Shift</button>
        </div>
        
        <button onclick="resetKeybindings(); this.blur();" style="background: #a44; width: 100%; margin-bottom: 10px; padding: 8px;">Reset All to Default</button>
      </div>
    </div>
    
    <button onclick="hideSettings(); this.blur();" style="margin: 10px;">Close</button>
  </div>
</div>

<!-- 移动端触摸控制 -->
<div id="mobileControls" style="display: none;">
  <!-- 左侧摇杆区域 -->
  <div id="joystickArea" style="position: fixed; top: 50%; left: 60px; transform: translateY(-50%); width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); z-index: 1000;">
    <div id="joystickKnob" style="position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.5); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); touch-action: none;"></div>
  </div>
  
  <!-- 右侧按钮区域 -->
  <div style="position: fixed; top: 50%; right: 60px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 1000;">
    <!-- 旋转按钮（3个） -->
    <div style="display: flex; gap: 10px; justify-content: center;">
      <button id="rotateCCWBtn" style="width: 65px; height: 65px; border-radius: 50%; background: rgba(100,100,255,0.8); border: 3px solid rgba(255,255,255,0.6); font-size: 22px; color: white; touch-action: manipulation;">↶</button>
      <button id="rotate180Btn" style="width: 65px; height: 65px; border-radius: 50%; background: rgba(150,100,255,0.8); border: 3px solid rgba(255,255,255,0.6); font-size: 18px; color: white; touch-action: manipulation; font-weight: bold;">180°</button>
      <button id="rotateCWBtn" style="width: 65px; height: 65px; border-radius: 50%; background: rgba(100,100,255,0.8); border: 3px solid rgba(255,255,255,0.6); font-size: 22px; color: white; touch-action: manipulation;">↷</button>
    </div>
    
    <!-- Hold和硬降按钮 -->
    <div style="display: flex; gap: 10px; justify-content: center;">
      <button id="holdBtn" style="width: 100px; height: 65px; border-radius: 35px; background: rgba(255,200,0,0.8); border: 3px solid rgba(255,255,255,0.6); font-size: 16px; color: white; font-weight: bold; touch-action: manipulation;">HOLD</button>
      <button id="hardDropBtn" style="width: 100px; height: 65px; border-radius: 35px; background: rgba(255,100,100,0.8); border: 3px solid rgba(255,255,255,0.6); font-size: 24px; color: white; touch-action: manipulation;">⬇ DROP</button>
    </div>
  </div>
</div>

function loadLevel(levelNum) {
  console.log(`Loading level ${levelNum}...`);
  
  if (levelNum < 1 || levelNum > MAX_LEVEL) {
    alert(`Level ${levelNum} does not exist!`);
    return;
  }
  
  // 检查关卡是否解锁
  if (levelNum > unlockedLevels) {
    alert(`Level ${levelNum} is locked! Complete previous levels first.`);
    return;
  }
  
  const levelData = LEVELS[levelNum];
  
  if (!levelData) {
    alert(`Level ${levelNum} not available yet!`);
    return;
  }
  
  console.log('Level data:', levelData);
  
  currentLevel = levelNum;
  currentLevelData = levelData;
  
  // 更新UI，显示关卡名称
  const levelName = LEVEL_NAMES[currentLevel] || `Level ${currentLevel}`;
  document.getElementById('level-number').textContent = currentLevel;
  document.getElementById('level-info').textContent = levelName;
  document.getElementById('prevBtn').disabled = currentLevel <= 1;
  document.getElementById('nextBtn').disabled = currentLevel >= unlockedLevels;
  
  // 应用关卡数据
  applyLevelData(levelData);
  
  console.log(`Level ${currentLevel} loaded successfully`);
}

function applyLevelData(levelData) {
  console.log('Applying level data:', levelData);
  
  // 更新版面大小
  COLS = levelData.width;
  ROWS = levelData.height;
  
  console.log(`Board size: ${COLS}x${ROWS}`);
  
  // 更新棋盘CSS
  const boardEl = document.getElementById('board');
  if (!boardEl) {
    console.error('Board element not found!');
    return;
  }
  
  // 计算最佳格子大小，确保正方形
  const availableWidth = window.innerWidth - 480; // 减去左右面板和间距
  const availableHeight = window.innerHeight - 80; // 减去padding
  
  const maxCellWidth = (availableWidth - 20) / COLS; // 减去padding和gap
  const maxCellHeight = (availableHeight - 20) / ROWS;
  
  // 选择较小的尺寸确保正方形
  const cellSize = Math.min(maxCellWidth, maxCellHeight, 35); // 最大35px
  
  const boardWidth = COLS * cellSize + (COLS - 1) * 2 + 16; // gap + padding
  const boardHeight = ROWS * cellSize + (ROWS - 1) * 2 + 16;
  
  boardEl.style.width = boardWidth + 'px';
  boardEl.style.height = boardHeight + 'px';
  boardEl.style.gridTemplateColumns = `repeat(${COLS}, ${cellSize}px)`;
  boardEl.style.gridTemplateRows = `repeat(${ROWS}, ${cellSize}px)`;
  
  // 重新创建棋盘格子
  cellEls = null;
  boardEl.innerHTML = '';
  cellEls = [];
  for (let y = 0; y < ROWS; y++) {
    cellEls[y] = [];
    for (let x = 0; x < COLS; x++) {
      const c = document.createElement('div');
      c.className = 'cell';
      boardEl.appendChild(c);
      cellEls[y][x] = c;
    }
  }
  
  console.log(`Created ${ROWS * COLS} cells`);
  
  // 恢复游戏状态（使用深拷贝避免修改原始数据）
  board = JSON.parse(JSON.stringify(levelData.board));
  targetMap = JSON.parse(JSON.stringify(levelData.targetMap || []));
  curr = levelData.currentPiece !== undefined ? levelData.currentPiece : null;
  rot = levelData.currentRotation !== undefined ? levelData.currentRotation : 0;
  x = levelData.currentX !== undefined ? levelData.currentX : Math.floor(COLS / 2);
  y = levelData.currentY !== undefined ? levelData.currentY : 0;
  hold = levelData.hold !== undefined ? levelData.hold : null;
  nextQ = [...(levelData.nextQueue || [])];
  canHold = levelData.canHold !== undefined ? levelData.canHold : true;
  gameActive = true;
  
  // 重置hold和锁定状态
  isHoldInProgress = false;
  isPieceLocking = false;
  
  // 重置统计
  playerCombo = 0;
  
  // 重绘
  console.log('Drawing board...');
  drawAll();
  console.log('Level applied successfully');
}

// ===== 绘制函数 =====
function drawBoard() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const isTarget = targetMap[y] && targetMap[y][x];
      
      // 先设置背景色
      if (board[y][x] === 'gray') {
        cellEls[y][x].style.background = '#666';
      } else if (board[y][x] && board[y][x] !== 'gray') {
        cellEls[y][x].style.background = PALETTE[board[y][x]];
      } else {
        cellEls[y][x].style.background = '#222';
      }
      
      // 然后设置边框
      if (isTarget) {
        // 如果目标位置已经被非灰色方块覆盖，不显示边框
        if (board[y][x] && board[y][x] !== 'gray') {
          cellEls[y][x].style.border = 'none';
        } else {
          // 空的目标位置显示黄色虚线边框
          cellEls[y][x].style.border = '2px dashed #ff0';
          cellEls[y][x].style.boxSizing = 'border-box';
        }
      } else {
        cellEls[y][x].style.border = 'none';
      }
    }
  }
  
  if (curr && gameActive) {
    const cells = getCurrentCells();
    cells.forEach(([cy, cx]) => {
      if (cy >= 0 && cy < ROWS && cx >= 0 && cx < COLS) {
        cellEls[cy][cx].style.background = PALETTE[curr];
        
        // 如果当前位置是目标位置，显示绿色边框
        const isTarget = targetMap[cy] && targetMap[cy][cx];
        if (isTarget) {
          cellEls[cy][cx].style.border = '2px dashed #0f0';
          cellEls[cy][cx].style.boxSizing = 'border-box';
        } else {
          cellEls[cy][cx].style.border = 'none';
        }
      }
    });
  }
  
  updateTargetStatus();
}

function drawGhost() {
  document.querySelectorAll('.ghost').forEach(g => g.remove());
  
  if (!curr || !gameActive) return;
  
  const ghostY = calculateGhostY();
  if (ghostY === y) return;
  
  const cells = SHAPES[curr][rot].map(([dy, dx0]) => [ghostY + dy, x + dx0]);
  const boardEl = document.getElementById('board');
  
  // 获取当前格子大小
  const boardStyle = window.getComputedStyle(boardEl);
  const gridCols = boardStyle.gridTemplateColumns.split(' ');
  const cellSize = parseFloat(gridCols[0]);
  
  cells.forEach(([cy, cx]) => {
    if (cy >= 0 && cy < ROWS && cx >= 0 && cx < COLS && (!board[cy] || board[cy][cx] === 0)) {
      const g = document.createElement('div');
      g.className = 'ghost';
      g.style.position = 'absolute';
      g.style.left = (8 + cx * (cellSize + 2)) + 'px';
      g.style.top = (8 + cy * (cellSize + 2)) + 'px';
      g.style.width = cellSize + 'px';
      g.style.height = cellSize + 'px';
      
      // 检查是否在目标位置
      const isTarget = targetMap[cy] && targetMap[cy][cx];
      if (isTarget) {
        // 在目标位置时使用绿色虚线边框
        g.style.border = '2px dashed #0f0';
      } else {
        // 普通位置使用白色虚线边框
        g.style.border = '2px dashed #fff';
      }
      
      boardEl.appendChild(g);
    }
  });
}

function createMiniBoard(pieceType, rotation) {
  const miniBoard = document.createElement('div');
  miniBoard.className = 'mini-board';
  miniBoard.style.position = 'relative';
  miniBoard.style.width = '50px';
  miniBoard.style.height = '50px';
  miniBoard.style.background = 'transparent';
  
  const cells = SHAPES[pieceType][rotation];
  cells.forEach(([dy, dx]) => {
    const cell = document.createElement('div');
    cell.style.position = 'absolute';
    cell.style.width = '10px';
    cell.style.height = '10px';
    cell.style.left = (dx * 11 + 5) + 'px';

    cell.style.borderRadius = '1px';
    miniBoard.appendChild(cell);
  });
  
  return miniBoard;
}

// ===== 游戏逻辑 =====
function nextPiece() {
  isPieceLocking = false; // 重置锁定标志
  
  if (nextQ.length === 0) {
    if (hold !== null) {
      curr = hold;
      hold = null;
      console.log('Took piece from hold (nextQ empty)');
    } else {
      gameActive = false;
      curr = null;
      console.log('No more pieces');
      drawAll();
      return;
    }
  } else {
    curr = nextQ.shift();
  }
  
  if (COLS === 3 && curr === 'I') {
    rot = 1;
  } else {
    rot = 0;
  }
  
  x = Math.floor((COLS - getShapeWidth()) / 2);
  y = 0;
  canHold = true;
  
  if (!isValidPosition()) {
    gameActive = false;
    alert('Game Over!');
    return;
  }
  
  drawAll();
}

function getCurrentCells() {
  return SHAPES[curr][rot].map(([dy, dx0]) => [y + dy, x + dx0]);
}

function getCurrentCellsForPiece(piece, px, py, prot) {
  return SHAPES[piece][prot].map(([dy, dx0]) => [py + dy, px + dx0]);
}

function getShapeWidth() {
  const cells = SHAPES[curr][rot];
  const xCoords = cells.map(([_, dx]) => dx);
  return Math.max(...xCoords) - Math.min(...xCoords) + 1;
}

function isValidPosition(newX = x, newY = y, newRot = rot) {
  const cells = SHAPES[curr][newRot].map(([dy, dx0]) => [newY + dy, newX + dx0]);
  return cells.every(([cy, cx]) => 
    cy >= 0 && cy < ROWS && cx >= 0 && cx < COLS && board[cy][cx] === 0
  );
}

function calculateGhostY() {
  let ghostY = y;
  while (isValidPosition(x, ghostY + 1, rot)) {
    ghostY++;
  }
  return ghostY;
}

function tryMove(dx) {
  const newX = x + dx;
  if (isValidPosition(newX, y, rot)) {
    x = newX;
    drawAll();
  }
}

function moveToEdge(direction) {
  // direction: -1 for left, 1 for right
  while (isValidPosition(x + direction, y, rot)) {
    x += direction;
  }
  drawAll();
}

function dropToBottom() {
  // 直接降到底部（类似硬降但不锁定）
  while (isValidPosition(x, y + 1, rot)) {
    y++;
  }
  drawAll();
}

function tryRotateCW() { rotateWithKick(1); }
function tryRotateCCW() { rotateWithKick(-1); }

function rotateWithKick(dir) {
  const len = SHAPES[curr].length;
  const newRot = (rot + dir + len) % len;

  console.log(`Trying to rotate ${curr} from ${rot} to ${newRot} at (${x},${y})`);

  if (isValidPosition(x, y, newRot)) {
    rot = newRot;
    console.log('Direct rotation successful');
    drawAll();
    return;
  }
  
  for (const [dx, dy] of KICK_TESTS) {
    if (isValidPosition(x + dx, y + dy, newRot)) {
      console.log(`Kick successful with offset (${dx},${dy})`);
      x += dx;
      y += dy;
      rot = newRot;
      drawAll();
      return;
    }
  }
  
  console.log('Rotation failed - no valid position found');
}

function tryRotate180() {
  const len = SHAPES[curr].length;
  const newRot = (rot + 2) % len;
  
  const kickTests = (curr === 'L' || curr === 'J') ? KICK_TESTS_180 : KICK_TESTS;
  
  if (isValidPosition(x, y, newRot)) {
    rot = newRot;
    drawAll();
    return;
  }
  
  for (const [dx, dy] of kickTests) {
    if (isValidPosition(x + dx, y + dy, newRot)) {
      x += dx;
      y += dy;
      rot = newRot;
      drawAll();
      return;
    }
  }
}

function softDrop() {
  if (isValidPosition(x, y + 1, rot)) {
    y++;
    drawAll();
  }
}

function hardDrop() {
  const ghostY = calculateGhostY();
  y = ghostY;
  isPieceLocking = true; // 标记开始锁定
  lockPiece();
}

function doHold() {
  // 如果方块正在锁定过程中，禁止hold操作
  if (isPieceLocking) return;
  
  if (!curr && nextQ.length === 0 && hold !== null && gameActive) {
    curr = hold;
    hold = null;
    
    if (COLS === 3 && curr === 'I') {
      rot = 1;
    } else {
      rot = 0;
    }
    
    x = Math.floor((COLS - getShapeWidth()) / 2);
    y = 0;
    canHold = true;
    
    if (!isValidPosition()) {
      gameActive = false;
      alert('Game Over!');
      return;
    }
    
    drawAll();
    return;
  }
  
  if (!curr || !gameActive || !canHold || isHoldInProgress) return;
  
  if (nextQ.length === 0 && hold === null) {
    return;
  }
  
  isHoldInProgress = true;
  canHold = true; // 禁止连续hold
  
  const currentPiece = curr;
  
  if (hold === null) {
    hold = currentPiece;
    nextPiece();
  } else {
    const temp = hold;
    hold = currentPiece;
    curr = temp;
    
    if (COLS === 3 && curr === 'I') {
      rot = 1;
    } else {
      rot = 0;
    }
    
    x = Math.floor((COLS - getShapeWidth()) / 2);
    y = 0;
    
    if (!isValidPosition()) {
      // 如果交换后的方块无法放置，恢复原状
      hold = currentPiece;
      curr = temp;
      canHold = true; // 恢复canHold状态
      gameActive = false;
      alert('Game Over!');
      isHoldInProgress = false;
      return;
    }
  }
  
  drawAll();
  isHoldInProgress = false;
}

function lockPiece() {
  const lockedPiece = curr; // 保存要锁定的方块
  curr = null; // 立即清空curr，防止在nextPiece调用前被hold
  canHold = true; // 重置hold状态
  
  const cells = getCurrentCellsForPiece(lockedPiece, x, y, rot);
  for (const [cy, cx] of cells) {
    if (cy >= 0 && cy < ROWS && cx >= 0 && cx < COLS) {
      board[cy][cx] = lockedPiece;
    }
  }
  
  const targetCompleted = checkTargetCompletion();
  
  let lines = 0;
  for (let row = ROWS - 1; row >= 0; row--) {
    let filled = true;
    for (let col = 0; col < COLS; col++) {
      if (board[row][col] === 0) {
        filled = false;
        break;
      }
    }
    if (filled) {
      lines++;
      
      // targetMap也要跟着下降
      targetMap.splice(row, 1);
      targetMap.unshift(null);
      
      board.splice(row, 1);
      board.unshift(Array(COLS).fill(0));
      row++;
    }
  }
  
  if (lines > 0) {
    playerCombo++;
    if (playerCombo > maxCombo) {
      maxCombo = playerCombo;
    }
    // 只有combo >= 2时才显示特效
    if (playerCombo >= 2) {
      showComboEffect(playerCombo);
    }
  } else {
    playerCombo = 0;
  }
  
  const isAllClear = board.every(row => row.every(cell => cell === 0));
  if (isAllClear) {
    allClearCount++;
    showAllClearEffect();
  }
  
  drawBoard();
  
  if (targetCompleted) {
    setTimeout(() => {
      gameActive = false;
      showLevelComplete();
    }, 300);
    return;
  }
  
  setTimeout(() => {
    nextPiece();
  }, 100);
}

// ===== 目标点系统 =====
function updateTargetStatus() {
  let totalTargets = 0;
  let coveredTargets = 0;
  
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (targetMap[y] && targetMap[y][x]) {
        totalTargets++;
        if (board[y][x] !== 0 && board[y][x] !== 'gray') {
          coveredTargets++;
        }
      }
    }
  }
  
  const statusEl = document.getElementById('target-status');
  if (statusEl) {
    statusEl.textContent = `Targets: ${coveredTargets}/${totalTargets}`;
  }
  
  return { totalTargets, coveredTargets };
}

function checkTargetCompletion() {
  const { totalTargets, coveredTargets } = updateTargetStatus();
  return totalTargets > 0 && coveredTargets === totalTargets;
}

// ===== 键盘控制 =====
function matchKey(eventKey, bindingKey) {
  if (bindingKey === eventKey) return true;
  if (bindingKey.toLowerCase() === eventKey.toLowerCase()) return true;
  return false;
}

function handleKeyDown(e) {
  // 处理键位重绑定
  if (waitingForKey) {
    e.preventDefault();
    keyBindings[waitingForKey] = e.key;
    updateKeybindingDisplay();
    const btn = document.getElementById(`key${waitingForKey.charAt(0).toUpperCase() + waitingForKey.slice(1)}`);
    btn.style.background = '#333';
    waitingForKey = null;
    saveSettings();
    return;
  }
  
  // Hold特殊处理（当没有当前方块但有hold时）
  if (matchKey(e.key, keyBindings.hold) && !curr && gameActive && !isHoldInProgress && hold !== null) {
    const currentTime = Date.now();
    if (currentTime - keyState.up.lastTime > KEY_THRESHOLD) {
      keyState.up.lastTime = currentTime;
      doHold();
    }
    return;
  }
  
  if (!curr || !gameActive || isHoldInProgress) return;
  
  const currentTime = Date.now();
  
  // 左移
  if (matchKey(e.key, keyBindings.left)) {
    e.preventDefault();
    if (!keyState.left.pressed && currentTime - keyState.left.lastTime > KEY_THRESHOLD) {
      keyState.left.pressed = true;
      keyState.left.lastTime = currentTime;
      
      if (keyDelay === 0) {
        moveToEdge(-1);
        keyState.left.pressed = false; // DAS=0是瞬间移动，立即重置
      } else {
        tryMove(-1);
        keyState.left.interval = setInterval(() => {
          if (keyState.left.pressed) {
            tryMove(-1);
          }
        }, keyDelay);
      }
    }
  }
  
  // 右移
  if (matchKey(e.key, keyBindings.right)) {
    e.preventDefault();
    if (!keyState.right.pressed && currentTime - keyState.right.lastTime > KEY_THRESHOLD) {
      keyState.right.pressed = true;
      keyState.right.lastTime = currentTime;
      
      if (keyDelay === 0) {
        moveToEdge(1);
        keyState.right.pressed = false; // DAS=0是瞬间移动，立即重置
      } else {
        tryMove(1);
        keyState.right.interval = setInterval(() => {
          if (keyState.right.pressed) {
            tryMove(1);
          }
        }, keyDelay);
      }
    }
  }
  
  // 顺时针旋转
  if (matchKey(e.key, keyBindings.rotateCW)) {
    if (currentTime - keyState.up.lastTime > KEY_THRESHOLD) {
      keyState.up.lastTime = currentTime;
      tryRotateCW();
    }
  }
  
  // 逆时针旋转
  if (matchKey(e.key, keyBindings.rotateCCW)) {
    if (currentTime - keyState.up.lastTime > KEY_THRESHOLD) {
      keyState.up.lastTime = currentTime;
      tryRotateCCW();
    }
  }
  
  // 180度旋转
  if (matchKey(e.key, keyBindings.rotate180)) {
    if (currentTime - keyState.up.lastTime > KEY_THRESHOLD) {
      keyState.up.lastTime = currentTime;
      tryRotate180();
    }
  }
  
  // 软降
  if (matchKey(e.key, keyBindings.softDrop)) {
    if (!keyState.down.pressed && currentTime - keyState.down.lastTime > KEY_THRESHOLD) {
      keyState.down.pressed = true;
      keyState.down.lastTime = currentTime;
      
      if (softDropSpeed === 0) {
        // Instant模式：直接降到底部，但不设置interval（因为已经到底了）
        dropToBottom();
        // 立即重置按键状态，因为instant drop是一次性的
        keyState.down.pressed = false;
      } else {
        softDrop();
        keyState.down.interval = setInterval(() => {
          if (keyState.down.pressed) {
            softDrop();
          }
        }, softDropSpeed);
      }
    }
  }
  
  // 硬降
  if (matchKey(e.key, keyBindings.hardDrop)) {
    e.preventDefault();
    if (currentTime - keyState.down.lastTime > KEY_THRESHOLD) {
      keyState.down.lastTime = currentTime;
      hardDrop();
    }
  }
  
  // Hold
  if (matchKey(e.key, keyBindings.hold)) {
    if (currentTime - keyState.up.lastTime > KEY_THRESHOLD) {
      keyState.up.lastTime = currentTime;
      doHold();
    }
  }
}

function handleKeyUp(e) {
  if (matchKey(e.key, keyBindings.left)) {
    keyState.left.pressed = false;
    if (keyState.left.interval) {
      clearInterval(keyState.left.interval);
      keyState.left.interval = null;
    }
  }
  
  if (matchKey(e.key, keyBindings.right)) {
    keyState.right.pressed = false;
    if (keyState.right.interval) {
      clearInterval(keyState.right.interval);
      keyState.right.interval = null;
    }
  }
  
  if (matchKey(e.key, keyBindings.softDrop)) {
    keyState.down.pressed = false;
    if (keyState.down.interval) {
      clearInterval(keyState.down.interval);
      keyState.down.interval = null;
    }
  }
}

// ===== 存档系统 =====
function saveProgress() {
  localStorage.setItem('ZhoumetryLevelProgress', JSON.stringify({
    unlockedLevels,
    unlockedChapters
  }));
  console.log(`Progress saved: ${unlockedLevels} levels, ${unlockedChapters} chapters unlocked`);
}

function loadProgress() {
  // 检查是否开启全部解锁模式
  if (UNLOCK_ALL_LEVELS === 1) {
    unlockedLevels = MAX_LEVEL;
    unlockedChapters = 3; // 解锁所有章节
    console.log('🔓 All levels unlocked mode enabled!');
    return;
  }
  
  const saved = localStorage.getItem('ZhoumetryLevelProgress');
  if (saved) {
    try {
      const progress = JSON.parse(saved);
      unlockedLevels = progress.unlockedLevels || 1;
      unlockedChapters = progress.unlockedChapters || 1;
      console.log(`Progress loaded: ${unlockedLevels} levels, ${unlockedChapters} chapters unlocked`);
    } catch (e) {
      // 兼容旧格式
      unlockedLevels = parseInt(saved);
      unlockedChapters = 1;
    }
  } else {
    unlockedLevels = 1;
    unlockedChapters = 1;
    console.log('No saved progress, starting from level 1');
  }
  
  // 加载自动下一关设置
  const autoNextSaved = localStorage.getItem('ZhoumetryAutoNext');
  if (autoNextSaved) {
    autoNextLevel = autoNextSaved === 'true';
  }
}

function saveAutoNextSetting() {
  autoNextLevel = document.getElementById('autoNextLevel').checked;
  localStorage.setItem('ztrisAutoNext', autoNextLevel.toString());
  console.log(`Auto next level: ${autoNextLevel}`);
}

function unlockNextLevel() {
  if (currentLevel >= unlockedLevels && currentLevel < MAX_LEVEL) {
    unlockedLevels = currentLevel + 1;
    
    // 检查是否解锁新章节
    for (const [id, chapter] of Object.entries(CHAPTERS)) {
      const chapterNum = parseInt(id);
      const lastLevelInChapter = chapter.levels[chapter.levels.length - 1];
      
      // 如果刚通过了某章节的最后一关，解锁下一章节
      if (currentLevel === lastLevelInChapter && chapterNum >= unlockedChapters) {
        unlockedChapters = chapterNum + 1;
        console.log(`Chapter ${unlockedChapters} unlocked!`);
        break;
      }
    }
    
    saveProgress();
    console.log(`Level ${unlockedLevels} unlocked!`);
  }
}

function resetProgress() {
  if (confirm('Are you sure you want to reset all progress? This will lock all levels and chapters except the first one.')) {
    unlockedLevels = 1;
    unlockedChapters = 1;
    saveProgress();
    loadLevel(1);
    alert('Progress reset! All levels and chapters except the first one are now locked.');
  }
}

// ===== 移动端控制 =====
function isMobileDevice() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
         (window.innerWidth <= 768);
}

function initMobileControls() {
  const mobileControls = document.getElementById('mobileControls');
  if (!isMobileDevice()) {
    mobileControls.style.display = 'none';
    return;
  }
  
  mobileControls.style.display = 'block';
  
  // 摇杆控制
  const joystickArea = document.getElementById('joystickArea');
  const joystickKnob = document.getElementById('joystickKnob');
  let joystickActive = false;
  let joystickInterval = null;
  let currentDirection = null;
  
  joystickArea.addEventListener('touchstart', (e) => {
    e.preventDefault();
    joystickActive = true;
    updateJoystick(e.touches[0]);
  });
  
  joystickArea.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (joystickActive) {
      updateJoystick(e.touches[0]);
    }
  });
  
  joystickArea.addEventListener('touchend', (e) => {
    e.preventDefault();
    joystickActive = false;
    joystickKnob.style.transform = 'translate(-50%, -50%)';
    currentDirection = null;
    if (joystickInterval) {
      clearInterval(joystickInterval);
      joystickInterval = null;
    }
  });
  
  function updateJoystick(touch) {
    const rect = joystickArea.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const deltaX = touch.clientX - centerX;
    const deltaY = touch.clientY - centerY;
    const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
    const maxDistance = rect.width / 2 - 30;
    
    // 限制摇杆范围
    const limitedDistance = Math.min(distance, maxDistance);
    const angle = Math.atan2(deltaY, deltaX);
    const knobX = Math.cos(angle) * limitedDistance;
    const knobY = Math.sin(angle) * limitedDistance;
    
    joystickKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
    
    // 判断方向
    let newDirection = null;
    if (distance > 20) {
      if (Math.abs(deltaX) > Math.abs(deltaY)) {
        newDirection = deltaX > 0 ? 'right' : 'left';
      } else {
        newDirection = deltaY > 0 ? 'down' : null;
      }
    }
    
    // 执行移动
    if (newDirection !== currentDirection) {
      currentDirection = newDirection;
      if (joystickInterval) {
        clearInterval(joystickInterval);
        joystickInterval = null;
      }
      
      if (currentDirection === 'left') {
        tryMove(-1);
        joystickInterval = setInterval(() => tryMove(-1), keyDelay || 100);
      } else if (currentDirection === 'right') {
        tryMove(1);
        joystickInterval = setInterval(() => tryMove(1), keyDelay || 100);
      } else if (currentDirection === 'down') {
        softDrop();
        joystickInterval = setInterval(() => softDrop(), softDropSpeed || 100);
      }
    }
  }
  
  // 按钮控制
  document.getElementById('rotateCWBtn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    tryRotateCW();
  });
  
  document.getElementById('rotateCCWBtn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    tryRotateCCW();
  });
  
  document.getElementById('rotate180Btn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    tryRotate180();
  });
  
  document.getElementById('holdBtn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    doHold();
  });
  
  document.getElementById('hardDropBtn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    hardDrop();
  });
}

// ===== 初始化 =====
window.onload = () => {
  window.addEventListener('keydown', handleKeyDown);
  window.addEventListener('keyup', handleKeyUp);
  
  // 初始化移动端控制
  initMobileControls();
  
  // 背景音乐
  const bgm = document.getElementById('bgm');
  bgm.volume = 0.3; // 设置音量为30%
  
  // 尝试播放音乐（处理浏览器自动播放限制）
  const playBGM = () => {
    bgm.play().catch(err => {
      console.log('BGM autoplay blocked, waiting for user interaction');
      // 用户第一次交互时播放
      document.addEventListener('click', () => {
        bgm.play();
      }, { once: true });
    });
  };
  playBGM();
  
  // 加载设置
  loadSettings();
  
  // 加载存档
  loadProgress();
  
  // 添加窗口大小改变监听器
  window.addEventListener('resize', () => {
    if (currentLevelData) {
      // 重新计算游戏板尺寸
      const boardEl = document.getElementById('board');
      const availableWidth = window.innerWidth - 480;
      const availableHeight = window.innerHeight - 80;
      
      const maxCellWidth = (availableWidth - 20) / COLS;
      const maxCellHeight = (availableHeight - 20) / ROWS;
      const cellSize = Math.min(maxCellWidth, maxCellHeight, 35);
      
      const boardWidth = COLS * cellSize + (COLS - 1) * 2 + 16;
      const boardHeight = ROWS * cellSize + (ROWS - 1) * 2 + 16;
      
      boardEl.style.width = boardWidth + 'px';
      boardEl.style.height = boardHeight + 'px';
      boardEl.style.gridTemplateColumns = `repeat(${COLS}, ${cellSize}px)`;
      boardEl.style.gridTemplateRows = `repeat(${ROWS}, ${cellSize}px)`;
      
      // 重新绘制
      drawAll();
    }
  });
  
  // 加载第一关
  loadLevel(1);
};
</script>
</body>
</html>
